{% load static %}
<!-- Toast container for flash messages -->
<div class="sb-toast-wrap" id="toastWrap" aria-live="polite">
  {% if messages %}
    {% for message in messages %}
      <div class="sb-toast sb-toast--{{ message.tags|default:'info' }}">
        <div class="sb-toast-icon">
          {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill"></i>
          {% elif message.tags == 'error' %}<i class="bi bi-exclamation-triangle-fill"></i>
          {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill"></i>
          {% else %}<i class="bi bi-info-circle-fill"></i>{% endif %}
        </div>
        <div class="sb-toast-body">{{ message }}</div>
        <button type="button" class="sb-toast-close" aria-label="Dismiss"><i class="bi bi-x-lg"></i></button>
      </div>
    {% endfor %}
  {% endif %}
</div>
